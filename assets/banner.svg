<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.5" stop-color="#0a2a6b"/>
      <stop offset="1" stop-color="#020f2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00b7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00b7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <symbol id="skull" viewBox="0 0 100 110">
      <ellipse cx="50" cy="42" rx="38" ry="36" fill="#e4f6ff" stroke="#7fd4ff" stroke-width="2"/>
      <rect x="27" y="66" width="46" height="30" rx="7" fill="#e4f6ff" stroke="#7fd4ff" stroke-width="2"/>
      <ellipse cx="33" cy="44" rx="11" ry="13" fill="#02101f"/>
      <ellipse cx="67" cy="44" rx="11" ry="13" fill="#02101f"/>
      <ellipse cx="33" cy="44" rx="4" ry="5" fill="#00b7ff" opacity="0.9"/>
      <ellipse cx="67" cy="44" rx="4" ry="5" fill="#00b7ff" opacity="0.9"/>
      <polygon points="50,57 43,70 57,70" fill="#02101f"/>
      <path d="M38 80V96M46 80V96M54 80V96M62 80V96" stroke="#7fd4ff" stroke-width="2"/>
      <path d="M27 82H73" stroke="#7fd4ff" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="260" fill="url(#glow)"/>
  <circle cx="1000" cy="180" r="260" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 60H1200M0 140H1200M0 220H1200M0 300H1200"/>
    <path d="M120 0V360M320 0V360M520 0V360M720 0V360M920 0V360M1120 0V360"/>
  </g>

  <!-- Caveiras de fundo -->
  <g opacity="0.10">
    <use xlink:href="#skull" href="#skull" x="470" y="22" width="50" height="55"/>
    <use xlink:href="#skull" href="#skull" x="680" y="22" width="50" height="55"/>
    <use xlink:href="#skull" href="#skull" x="470" y="290" width="40" height="44"/>
    <use xlink:href="#skull" href="#skull" x="690" y="290" width="40" height="44"/>
  </g>

  <!-- Caveiras principais -->
  <g>
    <use xlink:href="#skull" href="#skull" x="55" y="85" width="190" height="209" filter="url(#blur6)" opacity="0.5"/>
    <use xlink:href="#skull" href="#skull" x="55" y="85" width="190" height="209"/>
    <use xlink:href="#skull" href="#skull" x="955" y="85" width="190" height="209" filter="url(#blur6)" opacity="0.5"/>
    <use xlink:href="#skull" href="#skull" x="955" y="85" width="190" height="209"/>
  </g>
  <g opacity="0.85">
    <use xlink:href="#skull" href="#skull" x="265" y="215" width="70" height="77"/>
    <use xlink:href="#skull" href="#skull" x="865" y="215" width="70" height="77"/>
  </g>

  <rect x="20" y="20" width="1160" height="320" rx="18" fill="none" stroke="url(#title)" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Título -->
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,Helvetica,sans-serif" font-size="84" font-weight="900" letter-spacing="10" fill="#00b7ff" opacity="0.7" filter="url(#soft)">DEMONNY BOT</text>
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,Helvetica,sans-serif" font-size="84" font-weight="900" letter-spacing="10" fill="url(#title)">DEMONNY BOT</text>

  <!-- Divisor -->
  <path d="M350 217H560M640 217H850" stroke="url(#title)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="600,209 608,217 600,225 592,217" fill="#4fc3ff"/>

  <!-- Slogan -->
  <text x="600" y="268" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="26" letter-spacing="4" fill="#cfe9ff">DOMINE AS SOMBRAS. CONTROLE O CAOS.</text>
</svg>
